# Publishes the static CARGO ONE site to GitHub Pages (branch gh-pages) with REAL Taobao products:
# the real server imports them through OT Commerce (secret OTAPI_KEY) and exports catalog.json (no keys inside).
# The import result is cached between runs, so a rebuild does not spend paid calls again.
# Runs on every push to main and by hand (Actions → "Publish site" → Run workflow; tick "refresh" to re-import).
# Search requests: an issue titled "search: <query>" opened by the repository owner imports one page of Taobao results
# for that query (1 OT call), republishes the site, answers in the issue and closes it. Other people's issues are ignored.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Import the products again (17 OT Commerce calls)
        type: boolean
        default: false
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, 'search:') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Restore imported catalogue
        uses: actions/cache/restore@v4
        with:
          path: .data-pages
          key: catalog-taobao-${{ github.run_id }}
          restore-keys: catalog-taobao-
      - name: Build static site
        run: node scripts/build-artifact.mjs --pages
        env:
          LIVE_SEARCH_ORIGIN: ${{ vars.LIVE_SEARCH_ORIGIN }}
      - name: Search request from an issue
        if: github.event_name == 'issues'
        run: node --disable-warning=ExperimentalWarning scripts/search-import.mjs search-result.json
        env:
          SEARCH_QUERY: ${{ github.event.issue.title }}
          OTAPI_KEY: ${{ secrets.OTAPI_KEY }}
          OTAPI_PROVIDER: Taobao
          DATA_DIR: .data-pages
      - name: Import real products and export catalog.json
        run: node scripts/export-pages-catalog.mjs pages/catalog.json
        env:
          OTAPI_KEY: ${{ secrets.OTAPI_KEY }}
          OTAPI_PROVIDER: Taobao
          DATA_DIR: .data-pages
          CATALOG_REFRESH: ${{ inputs.refresh && '1' || '0' }}
      - name: Save imported catalogue
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data-pages
          key: catalog-taobao-${{ github.run_id }}
      - name: Keep the previous products if this import produced none
        run: |
          if [ ! -f pages/catalog.json ]; then
            git fetch -q --depth 1 origin gh-pages && git show origin/gh-pages:catalog.json > pages/catalog.json && echo "kept previous catalog.json" || rm -f pages/catalog.json
          fi
      - name: Publish to gh-pages
        run: |
          cd pages
          rm -f files.json
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
      - name: Answer the search request
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -f search-result.json ]; then
            msg=$(node -e 'const r=require("./search-result.json");console.log(r.ok?`Готово: найдено ${r.found} товаров по запросу «${r.query}». Через 1–2 минуты обновите сайт: https://hanchik000.github.io/cargo-one/#/shop?q=${encodeURIComponent(r.query)}`:`Не получилось (${r.error}${r.detail?": "+r.detail:""}). Попробуйте другой запрос.`)')
          else
            msg="Не получилось выполнить поиск. Попробуйте ещё раз."
          fi
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$msg"
          gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY"
